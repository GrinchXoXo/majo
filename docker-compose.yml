services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: middleman
      POSTGRES_PASSWORD: middleman
      POSTGRES_DB: middleman
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U middleman -d middleman"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai:
    build: ./ai
    restart: unless-stopped
    environment:
      # Reuse-audit R1 pilot: error reports go to GlitchTip (or any
      # Sentry-protocol endpoint) only when SENTRY_DSN is set.
      SENTRY_DSN: ${AI_SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_PORT: 8080
      DATABASE_URL: postgres://middleman:middleman@postgres:5432/middleman?sslmode=disable
      AI_SERVICE_URL: http://ai:8000
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-https://graph.facebook.com/v19.0}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      OPERATOR_API_TOKEN: ${OPERATOR_API_TOKEN:-}
      DASHBOARD_URL: http://localhost:3000
      MEDIA_STORAGE_DIR: /app/data/media
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SENTRY_DSN: ${BACKEND_SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
    ports:
      - "8080:8080"
    volumes:
      - media_data:/app/data/media

  dashboard:
    build: ./dashboard
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"

  # --- Reuse-audit R1 pilot: error tracking (NOT started by default) ---
  # Start with: docker compose --profile observability up -d glitchtip
  # GlitchTip runs all-in-one on PostgreSQL only (no Valkey/Redis), in its own
  # database server so it never shares Majo's data. UI: http://localhost:8001
  # Create a project per service there and put its DSN in BACKEND_SENTRY_DSN /
  # AI_SENTRY_DSN (from inside compose, use host "glitchtip:8000").
  glitchtip-postgres:
    image: postgres:16-alpine
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD:-change-me}
      POSTGRES_DB: glitchtip
    volumes:
      - glitchtip_pg:/var/lib/postgresql/data

  glitchtip:
    image: glitchtip/glitchtip:6
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      - glitchtip-postgres
    environment:
      SERVER_ROLE: all_in_one
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD:-change-me}@glitchtip-postgres:5432/glitchtip
      VALKEY_URL: ""
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8001}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-glitchtip@localhost}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
      GLITCHTIP_ENABLE_LOGS: "False"
    ports:
      - "8001:8000"
    volumes:
      - glitchtip_uploads:/code/uploads

volumes:
  postgres_data:
  media_data:
  glitchtip_pg:
  glitchtip_uploads:
